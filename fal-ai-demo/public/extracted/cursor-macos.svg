<?xml version="1.0" encoding="UTF-8"?>
<!-- macOS-style arrow pointer cursor. Geometry approximates Apple's default
     left-pointing arrow at 32x32 logical units (renders crisp at any size).
     Black fill with white border for visibility on light AND dark surfaces. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 32 32" shape-rendering="geometricPrecision">
  <!-- White outline (drawn slightly larger underneath) -->
  <path d="M 6 4 L 6 26 L 11 21 L 14.5 28.5 L 17.5 27 L 14 19.5 L 21 19.5 Z"
        fill="white" stroke="white" stroke-width="2" stroke-linejoin="round" />
  <!-- Black fill (drawn on top) -->
  <path d="M 6 4 L 6 26 L 11 21 L 14.5 28.5 L 17.5 27 L 14 19.5 L 21 19.5 Z"
        fill="black" stroke="black" stroke-width="0.5" stroke-linejoin="round" />
</svg>
